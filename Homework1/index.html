<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单位换算器 · 本地演示</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <p class="eyebrow">Homework1 · 纯前端演示</p>
        <h1>单位换算器</h1>
        <p class="lede">
          在长度、质量、温度、体积、时间和数据量之间换算。数据全部写在本地脚本里，不联网、不登录、不保存任何真实用户信息。
        </p>
      </header>

      <main>
        <section class="panel" aria-labelledby="convert-title">
          <div class="panel-head">
            <h2 id="convert-title">开始换算</h2>
            <p id="category-hint">选择类别后输入数值，结果会即时更新。</p>
          </div>

          <div class="category-tabs" role="tablist" aria-label="换算类别">
            <!-- filled by app.js -->
          </div>

          <form class="converter" id="converter-form">
            <label class="field">
              <span>数值</span>
              <input
                id="amount"
                name="amount"
                type="number"
                inputmode="decimal"
                step="any"
                value="1"
                required
              />
            </label>

            <label class="field">
              <span>从</span>
              <select id="from-unit" name="from"></select>
            </label>

            <button type="button" class="swap" id="swap-btn" title="交换单位" aria-label="交换单位">
              ⇄
            </button>

            <label class="field">
              <span>到</span>
              <select id="to-unit" name="to"></select>
            </label>
          </form>

          <output class="result" id="result" for="amount from-unit to-unit">
            <span class="result-eq">1 米 = 100 厘米</span>
            <span class="result-formula" id="formula"></span>
          </output>
        </section>

        <section class="panel" aria-labelledby="table-title">
          <div class="panel-head">
            <h2 id="table-title">常用对照</h2>
            <p>当前类别下，以输入值为基准的一组对照（示例数据，仅供课堂演示）。</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>单位</th>
                  <th>换算结果</th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </section>
      </main>

      <footer>
        <p>本项目不接入网络接口，也不处理密钥、账号或生产环境配置。</p>
      </footer>
    </div>
    <script src="app.js"></script>
  </body>
</html>
